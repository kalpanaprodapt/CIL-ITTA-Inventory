spring:
  application:
    name: inventory-device-service
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/itta_inventory}
    username: ${INVENTORY_DB_USER:itta}
    password: ${INVENTORY_DB_PASSWORD:itta}
    hikari:
      maximum-pool-size: ${INVENTORY_DB_POOL:20}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_device_history
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8102
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: inventory-device-service

inventory:
  events:
    topic-prefix: itta.inventory.device
  security:
    issuer-uri: ${AZURE_AD_ISSUER:https://login.microsoftonline.com/common/v2.0}
    audience: ${AZURE_AD_AUDIENCE:api://itta-inventory}
  tenancy:
    default-tenant: ${DEFAULT_TENANT:uniti}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.uniti.cil.itta.inventory: ${LOG_LEVEL:INFO}
