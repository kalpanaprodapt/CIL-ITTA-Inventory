apiVersion: v1
kind: Service
metadata:
  name: {{ include "itta.name" . }}
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "itta.selector" . | nindent 4 }}
