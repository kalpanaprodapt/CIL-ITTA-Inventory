            histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{service="inventory-change-service",uri="/api/v1/maintenance-windows"}[10m])) by (le)) > 2
          for: 20m
          labels:
            severity: warning
            domain: change
            entity: MaintenanceWindow
          annotations:
            summary: "Maintenance Window search is slow"
        - alert: ITTAWorkOrderErrorBudgetBurn
          expr: |
            sum(rate(http_server_requests_seconds_count{service="inventory-change-service",uri=~"/api/v1/work-orders.*",status=~"5.."}[1h]))
