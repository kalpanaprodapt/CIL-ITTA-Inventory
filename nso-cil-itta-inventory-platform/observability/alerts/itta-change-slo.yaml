apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: itta-change-slo
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: itta-change-slo
      rules:
        - alert: ITTAChangeRequestErrorBudgetBurn
          expr: |
            sum(rate(http_server_requests_seconds_count{service="inventory-change-service",uri=~"/api/v1/change-requests.*",status=~"5.."}[1h]))
              / sum(rate(http_server_requests_seconds_count{service="inventory-change-service",uri=~"/api/v1/change-requests.*"}[1h])) > 0.02
          for: 15m
          labels:
            severity: warning
            domain: change
            entity: ChangeRequest
          annotations:
            summary: "Change Request API burning error budget"
            description: "More than 2% of Change Request requests failed in the last hour."
        - alert: ITTAChangeRequestSlowSearch
          expr: |
            histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{service="inventory-change-service",uri="/api/v1/change-requests"}[10m])) by (le)) > 2
          for: 20m
          labels:
            severity: warning
            domain: change
            entity: ChangeRequest
          annotations:
            summary: "Change Request search is slow"
        - alert: ITTAMaintenanceWindowErrorBudgetBurn
          expr: |
            sum(rate(http_server_requests_seconds_count{service="inventory-change-service",uri=~"/api/v1/maintenance-windows.*",status=~"5.."}[1h]))
              / sum(rate(http_server_requests_seconds_count{service="inventory-change-service",uri=~"/api/v1/maintenance-windows.*"}[1h])) > 0.02
          for: 15m
          labels:
            severity: warning
            domain: change
            entity: MaintenanceWindow
          annotations:
            summary: "Maintenance Window API burning error budget"
            description: "More than 2% of Maintenance Window requests failed in the last hour."
        - alert: ITTAMaintenanceWindowSlowSearch
