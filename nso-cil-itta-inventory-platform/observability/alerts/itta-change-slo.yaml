          for: 20m
          labels:
            severity: warning
            domain: change
            entity: WorkOrder
          annotations:
            summary: "Work Order search is slow"
        - alert: ITTAFieldTaskErrorBudgetBurn
          expr: |
            sum(rate(http_server_requests_seconds_count{service="inventory-change-service",uri=~"/api/v1/field-tasks.*",status=~"5.."}[1h]))
              / sum(rate(http_server_requests_seconds_count{service="inventory-change-service",uri=~"/api/v1/field-tasks.*"}[1h])) > 0.02
          for: 15m
          labels:
            severity: warning
            domain: change
            entity: FieldTask
          annotations:
            summary: "Field Task API burning error budget"
            description: "More than 2% of Field Task requests failed in the last hour."
        - alert: ITTAFieldTaskSlowSearch
          expr: |
            histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{service="inventory-change-service",uri="/api/v1/field-tasks"}[10m])) by (le)) > 2
          for: 20m
          labels:
            severity: warning
            domain: change
            entity: FieldTask
          annotations:
            summary: "Field Task search is slow"
        - alert: ITTATechnicianErrorBudgetBurn
          expr: |
            sum(rate(http_server_requests_seconds_count{service="inventory-change-service",uri=~"/api/v1/technicians.*",status=~"5.."}[1h]))
              / sum(rate(http_server_requests_seconds_count{service="inventory-change-service",uri=~"/api/v1/technicians.*"}[1h])) > 0.02
          for: 15m
          labels:
            severity: warning
            domain: change
            entity: Technician
          annotations:
            summary: "Technician API burning error budget"
            description: "More than 2% of Technician requests failed in the last hour."
        - alert: ITTATechnicianSlowSearch
          expr: |
            histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{service="inventory-change-service",uri="/api/v1/technicians"}[10m])) by (le)) > 2
          for: 20m
