# Local development stack. Start one domain: docker compose --profile device up
name: itta-inventory
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: itta_inventory
      POSTGRES_USER: itta
      POSTGRES_PASSWORD: itta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itta -d itta_inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnami/kafka:3.8
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports:
      - "9092:9092"

  inventory-ui:
    build:
      context: ../nso-cil-itta-inventory-ui
      dockerfile: ../nso-cil-itta-inventory-platform/docker/inventory-ui/Dockerfile
    profiles: ["ui", "all"]
    ports:
      - "5173:8080"

  inventory-geography-service:
    build:
      context: ../nso-cil-itta-inventory-service
      dockerfile: ../nso-cil-itta-inventory-platform/docker/inventory-geography-service/Dockerfile
    profiles: ["geography", "all"]
    environment:
      SPRING_PROFILES_ACTIVE: dev
      INVENTORY_DB_URL: jdbc:postgresql://postgres:5432/itta_inventory
      INVENTORY_DB_USER: itta
      INVENTORY_DB_PASSWORD: itta
      KAFKA_BOOTSTRAP: kafka:9092
    ports:
      - "8100:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  inventory-geography-api:
    build:
      context: ../nso-cil-itta-inventory-api
      dockerfile: ../nso-cil-itta-inventory-platform/docker/inventory-geography-api/Dockerfile
    profiles: ["geography", "all"]
    environment:
      INVENTORY_GEOGRAPHY_URL: http://inventory-geography-service:8080
      ITTA_AUTH_ENFORCED: "false"
    ports:
      - "8200:8000"
    depends_on:
