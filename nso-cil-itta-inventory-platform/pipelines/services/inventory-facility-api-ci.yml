# CI pipeline for inventory-facility-api
name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
      - main
      - release/*
  paths:
    include:
      - src/itta_core/*
      - src/itta_api/domains/facility/*
      - tests/facility/*
      - pyproject.toml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - src/itta_core/*
      - src/itta_api/domains/facility/*
      - tests/facility/*
      - pyproject.toml

resources:
  repositories:
    - repository: source
      type: git
      name: CIL/nso-cil-itta-inventory-api
      ref: refs/heads/main
    - repository: platform
      type: git
      name: CIL/nso-cil-itta-inventory-platform
      ref: refs/heads/main

variables:
  - group: itta-inventory-shared
  - name: workload
    value: inventory-facility-api
  - name: imageRepository
    value: itta/inventory-facility-api
  - name: acr
    value: acruniticilitta.azurecr.io

stages:
  - stage: Build
    displayName: Build and test inventory-facility-api
    jobs:
      - job: BuildTest
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: source
      - template: templates/python-ci.yml
        parameters:
          repoName: nso-cil-itta-inventory-api
          testPath: tests/facility
          sonarProject: cil-itta-inventory-facility-api
  - stage: Image
    displayName: Build and push image
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: Docker
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: source
          - checkout: platform
          - template: templates/docker-build.yml@platform
            parameters:
              workload: inventory-facility-api
              dockerfile: docker/inventory-facility-api/Dockerfile
              context: source
              acrServiceConnection: sc-acr-cil-itta
  - stage: Scan
    displayName: Image and dependency scan
    dependsOn: Image
    jobs:
      - job: Trivy
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: templates/security-scan.yml@platform
            parameters:
              image: $(acr)/$(imageRepository):$(Build.BuildNumber)
  - stage: Handoff
    displayName: Trigger release pipeline
    dependsOn: Scan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Tag
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: platform
            persistCredentials: true
          - bash: |
              set -euo pipefail
              sed -i "s|^  tag: .*|  tag: $(Build.BuildNumber)|" helm/values/dev/inventory-facility-api.yaml
              git config user.email "pipeline@uniti.internal"
              git config user.name "cil-itta-pipeline"
              git commit -am "chore(inventory-facility-api): bump dev image to $(Build.BuildNumber)" || echo "nothing to commit"
              git push origin HEAD:main
            displayName: Bump dev image tag
