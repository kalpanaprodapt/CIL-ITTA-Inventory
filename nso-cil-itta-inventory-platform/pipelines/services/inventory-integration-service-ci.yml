# CI pipeline for inventory-integration-service
name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: true
  branches:
    include:
      - main
      - release/*
  paths:
    include:
      - inventory-common/*
      - inventory-integration-service/*
      - pom.xml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - inventory-common/*
      - inventory-integration-service/*
      - pom.xml

resources:
  repositories:
    - repository: source
      type: git
      name: CIL/nso-cil-itta-inventory-service
      ref: refs/heads/main
    - repository: platform
      type: git
      name: CIL/nso-cil-itta-inventory-platform
      ref: refs/heads/main

variables:
  - group: itta-inventory-shared
  - name: workload
    value: inventory-integration-service
  - name: imageRepository
    value: itta/inventory-integration-service
  - name: acr
    value: acruniticilitta.azurecr.io

stages:
  - stage: Build
    displayName: Build and test inventory-integration-service
    jobs:
      - job: BuildTest
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: source
      - template: templates/java-ci.yml
        parameters:
          repoName: nso-cil-itta-inventory-service
          module: inventory-integration-service
          sonarProject: cil-itta-inventory-integration-service
  - stage: Image
    displayName: Build and push image
    dependsOn: Build
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: Docker
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: source
          - checkout: platform
          - template: templates/docker-build.yml@platform
            parameters:
              workload: inventory-integration-service
              dockerfile: docker/inventory-integration-service/Dockerfile
              context: source
              acrServiceConnection: sc-acr-cil-itta
  - stage: Scan
    displayName: Image and dependency scan
    dependsOn: Image
    jobs:
      - job: Trivy
        pool:
          vmImage: ubuntu-latest
        steps:
          - template: templates/security-scan.yml@platform
            parameters:
              image: $(acr)/$(imageRepository):$(Build.BuildNumber)
  - stage: Handoff
    displayName: Trigger release pipeline
    dependsOn: Scan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Tag
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: platform
            persistCredentials: true
          - bash: |
              set -euo pipefail
              sed -i "s|^  tag: .*|  tag: $(Build.BuildNumber)|" helm/values/dev/inventory-integration-service.yaml
              git config user.email "pipeline@uniti.internal"
              git config user.name "cil-itta-pipeline"
              git commit -am "chore(inventory-integration-service): bump dev image to $(Build.BuildNumber)" || echo "nothing to commit"
              git push origin HEAD:main
            displayName: Bump dev image tag
