apiVersion: v1
kind: Namespace
metadata:
  name: itta-inventory-dev
  labels:
    cil.uniti.com/environment: dev
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: itta-inventory-dev
spec:
  hard:
    requests.cpu: "80"
    requests.memory: 160Gi
    limits.cpu: "160"
    limits.memory: 320Gi
    pods: "120"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: itta-inventory-dev
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
