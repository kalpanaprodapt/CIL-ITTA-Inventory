              app.kubernetes.io/name: inventory-ipam-service
              app.kubernetes.io/instance: inventory-ipam-service-dev
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: inventory-ipam-service
                    app.kubernetes.io/instance: inventory-ipam-service-dev
      containers:
        - name: inventory-ipam-service
          image: acruniticilitta.azurecr.io/itta/inventory-ipam-service:1.0.0-dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/urandom"
            - name: INVENTORY_DB_URL
              value: "jdbc:postgresql://pg-cil-itta-dev.postgres.database.azure.com:5432/itta_inventory?sslmode=require"
            - name: INVENTORY_DB_POOL
              value: "15"
            - name: KAFKA_BOOTSTRAP
