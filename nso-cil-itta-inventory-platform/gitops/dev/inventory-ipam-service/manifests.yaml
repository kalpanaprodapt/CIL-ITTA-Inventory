# Source: itta-workload/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inventory-ipam-service
  namespace: itta-inventory-dev
  labels:
    app.kubernetes.io/name: inventory-ipam-service
    app.kubernetes.io/instance: inventory-ipam-service-dev
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: itta-inventory
    app.kubernetes.io/managed-by: argocd
    cil.uniti.com/domain: ipam
    cil.uniti.com/environment: dev
    release: kube-prometheus-stack
spec:
  groups:
    - name: inventory-ipam-service.rules
      rules:
        - alert: InventoryIpamServiceHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{service="inventory-ipam-service",status=~"5.."}[5m]))
              / sum(rate(http_server_requests_seconds_count{service="inventory-ipam-service"}[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
            domain: ipam
          annotations:
            summary: "High 5xx ratio on inventory-ipam-service (dev)"
            runbook_url: "https://wiki.uniti.internal/cil/itta/runbooks/ipam"
        - alert: InventoryIpamServicePodRestarts
          expr: increase(kube_pod_container_status_restarts_total{namespace="itta-inventory-dev",pod=~"inventory-ipam-service-.*"}[30m]) > 3
          for: 5m
          labels:
            severity: warning
            domain: ipam
          annotations:
            summary: "inventory-ipam-service pods restarting in dev"
