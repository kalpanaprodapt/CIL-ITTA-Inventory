# Source: itta-workload/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-ipam-service-config
  namespace: itta-inventory-dev
  labels:
    app.kubernetes.io/name: inventory-ipam-service
    app.kubernetes.io/instance: inventory-ipam-service-dev
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: itta-inventory
    app.kubernetes.io/managed-by: argocd
    cil.uniti.com/domain: ipam
    cil.uniti.com/environment: dev
data:
  application-dev.yaml: |
    spring:
      datasource:
        hikari:
          maximum-pool-size: 15
          minimum-idle: 2
      jpa:
        open-in-view: false
        properties:
          hibernate.jdbc.batch_size: 50
      kafka:
        producer:
          acks: all
    inventory:
      events:
        topic-prefix: itta.inventory.ipam
        topics:
          - itta.inventory.ipam.ipsubnet
          - itta.inventory.ipam.ipaddress
          - itta.inventory.ipam.ippool
          - itta.inventory.ipam.vrfinstance
          - itta.inventory.ipam.dnsrecord
      security:
        enforce-roles: false
      tenancy:
        default-tenant: uniti
      export:
        page-size: 500
    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus
    logging:
      level:
        com.uniti.cil.itta: DEBUG
