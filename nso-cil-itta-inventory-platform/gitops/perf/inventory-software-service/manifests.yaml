# Source: itta-workload/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-software-service-config
  namespace: itta-inventory-perf
  labels:
    app.kubernetes.io/name: inventory-software-service
    app.kubernetes.io/instance: inventory-software-service-perf
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: itta-inventory
    app.kubernetes.io/managed-by: argocd
    cil.uniti.com/domain: software
    cil.uniti.com/environment: perf
data:
  application-perf.yaml: |
    spring:
      datasource:
        hikari:
          maximum-pool-size: 25
          minimum-idle: 2
      jpa:
        open-in-view: false
        properties:
          hibernate.jdbc.batch_size: 50
      kafka:
        producer:
          acks: all
    inventory:
      events:
        topic-prefix: itta.inventory.software
        topics:
          - itta.inventory.software.softwareimage
          - itta.inventory.software.softwareversion
          - itta.inventory.software.patch
          - itta.inventory.software.licensekey
          - itta.inventory.software.licensepool
      security:
        enforce-roles: false
      tenancy:
        default-tenant: uniti
      export:
        page-size: 500
    management:
      endpoints:
        web:
          exposure:
            include: health,info,prometheus
    logging:
      level:
        com.uniti.cil.itta: WARN
