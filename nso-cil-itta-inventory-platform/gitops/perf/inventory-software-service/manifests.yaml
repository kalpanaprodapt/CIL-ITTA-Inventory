# Source: itta-workload/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inventory-software-service
  namespace: itta-inventory-perf
  labels:
    app.kubernetes.io/name: inventory-software-service
    app.kubernetes.io/instance: inventory-software-service-perf
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: itta-inventory
    app.kubernetes.io/managed-by: argocd
    cil.uniti.com/domain: software
    cil.uniti.com/environment: perf
    release: kube-prometheus-stack
spec:
  groups:
    - name: inventory-software-service.rules
      rules:
        - alert: InventorySoftwareServiceHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{service="inventory-software-service",status=~"5.."}[5m]))
              / sum(rate(http_server_requests_seconds_count{service="inventory-software-service"}[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
            domain: software
          annotations:
            summary: "High 5xx ratio on inventory-software-service (perf)"
            runbook_url: "https://wiki.uniti.internal/cil/itta/runbooks/software"
        - alert: InventorySoftwareServicePodRestarts
          expr: increase(kube_pod_container_status_restarts_total{namespace="itta-inventory-perf",pod=~"inventory-software-service-.*"}[30m]) > 3
          for: 5m
          labels:
            severity: warning
            domain: software
          annotations:
            summary: "inventory-software-service pods restarting in perf"
