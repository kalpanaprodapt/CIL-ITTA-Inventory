# Source: itta-workload/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory-ui
  namespace: itta-inventory-qa
  labels:
    app.kubernetes.io/name: inventory-ui
    app.kubernetes.io/instance: inventory-ui-qa
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: itta-inventory
    app.kubernetes.io/managed-by: argocd
    cil.uniti.com/domain: ui
    cil.uniti.com/environment: qa
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/enable-cors: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - inventory.qa.cil.uniti.internal
      secretName: inventory-ui-tls
  rules:
    - host: inventory.qa.cil.uniti.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inventory-ui
                port:
                  name: http
