# Source: itta-workload/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-ui
  namespace: itta-inventory-qa
  labels:
    app.kubernetes.io/name: inventory-ui
    app.kubernetes.io/instance: inventory-ui-qa
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: itta-inventory
    app.kubernetes.io/managed-by: argocd
    cil.uniti.com/domain: ui
    cil.uniti.com/environment: qa
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-ui
      app.kubernetes.io/instance: inventory-ui-qa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-ui
        app.kubernetes.io/instance: inventory-ui-qa
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: itta-inventory
        app.kubernetes.io/managed-by: argocd
        cil.uniti.com/domain: ui
        cil.uniti.com/environment: qa
      annotations:
        prometheus.io/scrape: "false"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        checksum/config: "317598945781"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      serviceAccountName: inventory-ui
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: inventory-ui
              app.kubernetes.io/instance: inventory-ui-qa
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: inventory-ui
                    app.kubernetes.io/instance: inventory-ui-qa
      containers:
        - name: inventory-ui
          image: acruniticilitta.azurecr.io/itta/inventory-ui:1.0.0-qa
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: API_UPSTREAM_PREFIX
              value: "https://api-gateway.inventory.qa.cil.uniti.internal"
            - name: RUNTIME_ENV
              value: "qa"

          envFrom:
            - configMapRef:
                name: inventory-ui-env
                optional: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /config
              readOnly: true

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: config
          configMap:
            name: inventory-ui-config

