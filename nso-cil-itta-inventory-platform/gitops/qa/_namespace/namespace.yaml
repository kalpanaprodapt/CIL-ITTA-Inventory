apiVersion: v1
kind: Namespace
metadata:
  name: itta-inventory-qa
  labels:
    cil.uniti.com/environment: qa
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: itta-inventory-qa
spec:
  hard:
    requests.cpu: "120"
    requests.memory: 240Gi
    limits.cpu: "240"
    limits.memory: 480Gi
    pods: "180"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: itta-inventory-qa
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
