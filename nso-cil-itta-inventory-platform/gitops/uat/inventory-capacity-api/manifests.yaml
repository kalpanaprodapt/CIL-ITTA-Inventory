# Source: itta-workload/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inventory-capacity-api
  namespace: itta-inventory-uat
  labels:
    app.kubernetes.io/name: inventory-capacity-api
    app.kubernetes.io/instance: inventory-capacity-api-uat
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: itta-inventory
    app.kubernetes.io/managed-by: argocd
    cil.uniti.com/domain: capacity
    cil.uniti.com/environment: uat
    release: kube-prometheus-stack
spec:
  groups:
    - name: inventory-capacity-api.rules
      rules:
        - alert: InventoryCapacityApiHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{service="inventory-capacity-api",status=~"5.."}[5m]))
              / sum(rate(http_server_requests_seconds_count{service="inventory-capacity-api"}[5m])) > 0.05
          for: 10m
          labels:
            severity: warning
            domain: capacity
          annotations:
            summary: "High 5xx ratio on inventory-capacity-api (uat)"
            runbook_url: "https://wiki.uniti.internal/cil/itta/runbooks/capacity"
        - alert: InventoryCapacityApiPodRestarts
          expr: increase(kube_pod_container_status_restarts_total{namespace="itta-inventory-uat",pod=~"inventory-capacity-api-.*"}[30m]) > 3
          for: 5m
          labels:
            severity: warning
            domain: capacity
          annotations:
            summary: "inventory-capacity-api pods restarting in uat"
