        - name: CapacityPlan
          path: /api/v1/capacity-plans
          fields: 15
        - name: UtilizationSample
          path: /api/v1/utilization-samples
          fields: 15
        - name: ThresholdPolicy
          path: /api/v1/threshold-policies
          fields: 15
        - name: ForecastModel
          path: /api/v1/forecast-models
          fields: 14
        - name: Reservation
          path: /api/v1/reservations
          fields: 15
      logging:
        level: INFO
