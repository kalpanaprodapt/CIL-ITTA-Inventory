apiVersion: v1
kind: Namespace
metadata:
  name: itta-inventory-uat
  labels:
    cil.uniti.com/environment: uat
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: itta-inventory-uat
spec:
  hard:
    requests.cpu: "160"
    requests.memory: 320Gi
    limits.cpu: "320"
    limits.memory: 640Gi
    pods: "240"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: itta-inventory-uat
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
