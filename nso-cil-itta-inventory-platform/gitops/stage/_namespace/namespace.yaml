apiVersion: v1
kind: Namespace
metadata:
  name: itta-inventory-stage
  labels:
    cil.uniti.com/environment: stage
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute
  namespace: itta-inventory-stage
spec:
  hard:
    requests.cpu: "240"
    requests.memory: 480Gi
    limits.cpu: "480"
    limits.memory: 960Gi
    pods: "360"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: itta-inventory-stage
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
