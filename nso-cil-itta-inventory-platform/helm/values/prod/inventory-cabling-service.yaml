# Helm values for inventory-cabling-service in prod
nameOverride: inventory-cabling-service
kind: java
domain: cabling
environment: prod
namespace: itta-inventory-prod

image:
  repository: acruniticilitta.azurecr.io/itta/inventory-cabling-service
  tag: 1.0.0
  pullPolicy: IfNotPresent

replicaCount: 3

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

probes:
  startup: /actuator/health/liveness
  liveness: /actuator/health/liveness
  readiness: /actuator/health/readiness

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "prod"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/urandom"
  - name: INVENTORY_DB_URL
    value: "jdbc:postgresql://pg-cil-itta-prod.postgres.database.azure.com:5432/itta_inventory?sslmode=require"
  - name: INVENTORY_DB_POOL
    value: "25"
  - name: KAFKA_BOOTSTRAP
    value: "evh-cil-itta-prod.servicebus.windows.net:9093"
  - name: AZURE_AD_ISSUER
    value: "https://login.microsoftonline.com/uniti-cil/v2.0"
  - name: AZURE_AD_AUDIENCE
    value: "api://itta-inventory"
  - name: DEFAULT_TENANT
    value: "uniti"
  - name: LOG_LEVEL
    value: "WARN"
  - name: SERVER_PORT
    value: "8080"
  - name: MANAGEMENT_SERVER_PORT
    value: "8080"

ingress:
  enabled: false

serviceMonitor:
  enabled: true
  interval: 30s

workloadIdentity:
  clientId: "45424207-0000-4000-8000-075491398614"

keyVault:
  name: kv-cil-itta-prod
  secrets:
    - itta-cabling-db-password
    - itta-eventhub-connection
    - itta-aad-client-secret

cluster:
  name: aks-cil-prod-eus2
  region: eastus2
  subscription: sub-cil-prod
