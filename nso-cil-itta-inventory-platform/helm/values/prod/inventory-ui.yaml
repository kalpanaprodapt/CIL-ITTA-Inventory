# Helm values for inventory-ui in prod
nameOverride: inventory-ui
kind: ui
domain: ui
environment: prod
namespace: itta-inventory-prod

image:
  repository: acruniticilitta.azurecr.io/itta/inventory-ui
  tag: 1.0.0
  pullPolicy: IfNotPresent

replicaCount: 3

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

probes:
  startup: /healthz
  liveness: /healthz
  readiness: /healthz

env:
  - name: API_UPSTREAM_PREFIX
    value: "https://api-gateway.inventory.prod.cil.uniti.internal"
  - name: RUNTIME_ENV
    value: "prod"

ingress:
  enabled: true
  className: nginx
  host: inventory.prod.cil.uniti.internal
  tlsSecret: inventory-ui-tls
  clusterIssuer: letsencrypt-prod

serviceMonitor:
  enabled: false
  interval: 30s

workloadIdentity:
  clientId: "92289677-0000-4000-8000-520382578258"

keyVault:
  name: kv-cil-itta-prod
  secrets:
    - itta-ui-db-password
    - itta-eventhub-connection
    - itta-aad-client-secret

cluster:
  name: aks-cil-prod-eus2
  region: eastus2
  subscription: sub-cil-prod
