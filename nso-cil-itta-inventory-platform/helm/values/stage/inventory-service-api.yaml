# Helm values for inventory-service-api in stage
nameOverride: inventory-service-api
kind: python
domain: service
environment: stage
namespace: itta-inventory-stage

image:
  repository: acruniticilitta.azurecr.io/itta/inventory-service-api
  tag: 1.0.0-stage
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 8080
  targetPort: 8000

resources:
  requests:
    cpu: 300m
    memory: 256Mi
  limits:
    cpu: 1500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  startup: /healthz
  liveness: /healthz
  readiness: /readyz

env:
  - name: INVENTORY_SERVICE_URL
    value: "http://inventory-service-service.itta-inventory-stage.svc.cluster.local:8080"
  - name: ITTA_AUTH_ENFORCED
    value: "true"
  - name: ITTA_DEFAULT_TENANT
    value: "uniti"
  - name: ITTA_LOG_LEVEL
    value: "INFO"
  - name: ITTA_UPSTREAM_TIMEOUT
    value: "10"
  - name: ITTA_UPSTREAM_RETRIES
    value: "2"
  - name: ITTA_CACHE_ENTRIES
    value: "10000"
  - name: ITTA_CORS_ORIGINS
    value: "https://inventory.stage.cil.uniti.internal"
  - name: AZURE_AD_AUDIENCE
    value: "api://itta-inventory"
  - name: WEB_CONCURRENCY
    value: "4"

ingress:
  enabled: true
  className: nginx
  host: api-service.inventory.stage.cil.uniti.internal
  tlsSecret: inventory-service-api-tls
  clusterIssuer: letsencrypt-prod

serviceMonitor:
  enabled: true
  interval: 30s

workloadIdentity:
  clientId: "87930373-0000-4000-8000-740144109970"

keyVault:
  name: kv-cil-itta-stage
  secrets:
    - itta-service-db-password
    - itta-eventhub-connection
    - itta-aad-client-secret

cluster:
  name: aks-cil-stage-eus2
  region: eastus2
  subscription: sub-cil-prod
