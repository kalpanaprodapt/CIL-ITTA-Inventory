# Helm values for inventory-mpls-service in stage
nameOverride: inventory-mpls-service
kind: java
domain: mpls
environment: stage
namespace: itta-inventory-stage

image:
  repository: acruniticilitta.azurecr.io/itta/inventory-mpls-service
  tag: 1.0.0-stage
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 300m
    memory: 768Mi
  limits:
    cpu: 1500m
    memory: 1536Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  startup: /actuator/health/liveness
  liveness: /actuator/health/liveness
  readiness: /actuator/health/readiness

env:
  - name: SPRING_PROFILES_ACTIVE
    value: "stage"
  - name: JAVA_TOOL_OPTIONS
    value: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/urandom"
  - name: INVENTORY_DB_URL
    value: "jdbc:postgresql://pg-cil-itta-stage.postgres.database.azure.com:5432/itta_inventory?sslmode=require"
  - name: INVENTORY_DB_POOL
    value: "20"
  - name: KAFKA_BOOTSTRAP
    value: "evh-cil-itta-stage.servicebus.windows.net:9093"
  - name: AZURE_AD_ISSUER
    value: "https://login.microsoftonline.com/uniti-cil/v2.0"
  - name: AZURE_AD_AUDIENCE
    value: "api://itta-inventory"
  - name: DEFAULT_TENANT
    value: "uniti"
  - name: LOG_LEVEL
    value: "INFO"
  - name: SERVER_PORT
    value: "8080"
  - name: MANAGEMENT_SERVER_PORT
    value: "8080"

ingress:
  enabled: false

serviceMonitor:
  enabled: true
  interval: 30s

workloadIdentity:
  clientId: "90447675-0000-4000-8000-834862801322"

keyVault:
  name: kv-cil-itta-stage
  secrets:
    - itta-mpls-db-password
    - itta-eventhub-connection
    - itta-aad-client-secret

cluster:
  name: aks-cil-stage-eus2
  region: eastus2
  subscription: sub-cil-prod
