# Helm values for inventory-ui in stage
nameOverride: inventory-ui
kind: ui
domain: ui
environment: stage
namespace: itta-inventory-stage

image:
  repository: acruniticilitta.azurecr.io/itta/inventory-ui
  tag: 1.0.0-stage
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  startup: /healthz
  liveness: /healthz
  readiness: /healthz

env:
  - name: API_UPSTREAM_PREFIX
    value: "https://api-gateway.inventory.stage.cil.uniti.internal"
  - name: RUNTIME_ENV
    value: "stage"

ingress:
  enabled: true
  className: nginx
  host: inventory.stage.cil.uniti.internal
  tlsSecret: inventory-ui-tls
  clusterIssuer: letsencrypt-prod

serviceMonitor:
  enabled: false
  interval: 30s

workloadIdentity:
  clientId: "95817675-0000-4000-8000-722174033641"

keyVault:
  name: kv-cil-itta-stage
  secrets:
    - itta-ui-db-password
    - itta-eventhub-connection
    - itta-aad-client-secret

cluster:
  name: aks-cil-stage-eus2
  region: eastus2
  subscription: sub-cil-prod
