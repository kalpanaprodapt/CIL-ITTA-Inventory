# Helm values for inventory-virtual-api in perf
nameOverride: inventory-virtual-api
kind: python
domain: virtual
environment: perf
namespace: itta-inventory-perf

image:
  repository: acruniticilitta.azurecr.io/itta/inventory-virtual-api
  tag: 1.0.0-perf
  pullPolicy: IfNotPresent

replicaCount: 3

service:
  type: ClusterIP
  port: 8080
  targetPort: 8000

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  startup: /healthz
  liveness: /healthz
  readiness: /readyz

env:
  - name: INVENTORY_VIRTUAL_URL
    value: "http://inventory-virtual-service.itta-inventory-perf.svc.cluster.local:8080"
  - name: ITTA_AUTH_ENFORCED
    value: "false"
  - name: ITTA_DEFAULT_TENANT
    value: "uniti"
  - name: ITTA_LOG_LEVEL
    value: "WARN"
  - name: ITTA_UPSTREAM_TIMEOUT
    value: "10"
  - name: ITTA_UPSTREAM_RETRIES
    value: "2"
  - name: ITTA_CACHE_ENTRIES
    value: "10000"
  - name: ITTA_CORS_ORIGINS
    value: "https://inventory.perf.cil.uniti.internal"
  - name: AZURE_AD_AUDIENCE
    value: "api://itta-inventory"
  - name: WEB_CONCURRENCY
    value: "4"

ingress:
  enabled: true
  className: nginx
  host: api-virtual.inventory.perf.cil.uniti.internal
  tlsSecret: inventory-virtual-api-tls
  clusterIssuer: letsencrypt-staging

serviceMonitor:
  enabled: true
  interval: 30s

workloadIdentity:
  clientId: "03960668-0000-4000-8000-388312653412"

keyVault:
  name: kv-cil-itta-perf
  secrets:
    - itta-virtual-db-password
    - itta-eventhub-connection
    - itta-aad-client-secret

cluster:
  name: aks-cil-perf-cus
  region: centralus
  subscription: sub-cil-perf
