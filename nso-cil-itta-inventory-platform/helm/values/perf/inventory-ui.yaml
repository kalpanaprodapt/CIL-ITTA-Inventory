# Helm values for inventory-ui in perf
nameOverride: inventory-ui
kind: ui
domain: ui
environment: perf
namespace: itta-inventory-perf

image:
  repository: acruniticilitta.azurecr.io/itta/inventory-ui
  tag: 1.0.0-perf
  pullPolicy: IfNotPresent

replicaCount: 3

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  startup: /healthz
  liveness: /healthz
  readiness: /healthz

env:
  - name: API_UPSTREAM_PREFIX
    value: "https://api-gateway.inventory.perf.cil.uniti.internal"
  - name: RUNTIME_ENV
    value: "perf"

ingress:
  enabled: true
  className: nginx
  host: inventory.perf.cil.uniti.internal
  tlsSecret: inventory-ui-tls
  clusterIssuer: letsencrypt-staging

serviceMonitor:
  enabled: false
  interval: 30s

workloadIdentity:
  clientId: "16010612-0000-4000-8000-469906291771"

keyVault:
  name: kv-cil-itta-perf
  secrets:
    - itta-ui-db-password
    - itta-eventhub-connection
    - itta-aad-client-secret

cluster:
  name: aks-cil-perf-cus
  region: centralus
  subscription: sub-cil-perf
