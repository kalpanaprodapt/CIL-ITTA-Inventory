# Helm values for inventory-topology-api in dev
nameOverride: inventory-topology-api
kind: python
domain: topology
environment: dev
namespace: itta-inventory-dev

image:
  repository: acruniticilitta.azurecr.io/itta/inventory-topology-api
  tag: 1.0.0-dev
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

probes:
  startup: /healthz
  liveness: /healthz
  readiness: /readyz

env:
  - name: INVENTORY_TOPOLOGY_URL
    value: "http://inventory-topology-service.itta-inventory-dev.svc.cluster.local:8080"
  - name: ITTA_AUTH_ENFORCED
    value: "false"
  - name: ITTA_DEFAULT_TENANT
    value: "uniti"
  - name: ITTA_LOG_LEVEL
    value: "DEBUG"
  - name: ITTA_UPSTREAM_TIMEOUT
    value: "10"
  - name: ITTA_UPSTREAM_RETRIES
    value: "2"
  - name: ITTA_CACHE_ENTRIES
    value: "10000"
  - name: ITTA_CORS_ORIGINS
    value: "https://inventory.dev.cil.uniti.internal"
  - name: AZURE_AD_AUDIENCE
    value: "api://itta-inventory"
  - name: WEB_CONCURRENCY
    value: "2"

ingress:
  enabled: true
  className: nginx
  host: api-topology.inventory.dev.cil.uniti.internal
  tlsSecret: inventory-topology-api-tls
  clusterIssuer: letsencrypt-staging

serviceMonitor:
  enabled: true
  interval: 30s

workloadIdentity:
  clientId: "78400143-0000-4000-8000-370181622802"

keyVault:
  name: kv-cil-itta-dev
  secrets:
    - itta-topology-db-password
    - itta-eventhub-connection
    - itta-aad-client-secret

cluster:
  name: aks-cil-nonprod-eus2
  region: eastus2
  subscription: sub-cil-nonprod
