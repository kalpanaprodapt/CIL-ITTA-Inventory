# Helm values for inventory-mpls-api in qa
nameOverride: inventory-mpls-api
kind: python
domain: mpls
environment: qa
namespace: itta-inventory-qa

image:
  repository: acruniticilitta.azurecr.io/itta/inventory-mpls-api
  tag: 1.0.0-qa
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 8080
  targetPort: 8000

resources:
  requests:
    cpu: 150m
    memory: 192Mi
  limits:
    cpu: 750m
    memory: 384Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 1

probes:
  startup: /healthz
  liveness: /healthz
  readiness: /readyz

env:
  - name: INVENTORY_MPLS_URL
    value: "http://inventory-mpls-service.itta-inventory-qa.svc.cluster.local:8080"
  - name: ITTA_AUTH_ENFORCED
    value: "false"
  - name: ITTA_DEFAULT_TENANT
    value: "uniti"
  - name: ITTA_LOG_LEVEL
    value: "INFO"
  - name: ITTA_UPSTREAM_TIMEOUT
    value: "10"
  - name: ITTA_UPSTREAM_RETRIES
    value: "2"
  - name: ITTA_CACHE_ENTRIES
    value: "10000"
  - name: ITTA_CORS_ORIGINS
    value: "https://inventory.qa.cil.uniti.internal"
  - name: AZURE_AD_AUDIENCE
    value: "api://itta-inventory"
  - name: WEB_CONCURRENCY
    value: "2"

ingress:
  enabled: true
  className: nginx
  host: api-mpls.inventory.qa.cil.uniti.internal
  tlsSecret: inventory-mpls-api-tls
  clusterIssuer: letsencrypt-staging

serviceMonitor:
  enabled: true
  interval: 30s

workloadIdentity:
  clientId: "35418434-0000-4000-8000-338897335928"

keyVault:
  name: kv-cil-itta-qa
  secrets:
    - itta-mpls-db-password
    - itta-eventhub-connection
    - itta-aad-client-secret

cluster:
  name: aks-cil-nonprod-eus2
  region: eastus2
  subscription: sub-cil-nonprod
